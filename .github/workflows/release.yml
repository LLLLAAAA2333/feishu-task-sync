name: Release plugin
on:
  push:
    tags: ['*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check-release
      - run: node scripts/package.mjs
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/feishu-sync/main.js dist/feishu-sync/manifest.json dist/feishu-sync/styles.css
          dist/Feishu-Sync-*-Desktop.zip dist/SHA256SUMS.txt
          --title "Feishu Sync $RELEASE_TAG" --notes-file RELEASE_NOTES.md --verify-tag
