name: Release plugin
on:
  push:
    tags: ['*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check-release
      - run: node scripts/package.mjs
      - name: Attest plugin build
        uses: actions/attest@v4.2.2
        with:
          subject-path: |
            dist/feishu-task-sync/main.js
            dist/feishu-task-sync/manifest.json
            dist/feishu-task-sync/styles.css
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/feishu-task-sync/main.js dist/feishu-task-sync/manifest.json dist/feishu-task-sync/styles.css
          dist/Feishu-Task-Sync-*-Desktop.zip dist/SHA256SUMS.txt
          --title "Feishu Task Sync $RELEASE_TAG" --notes-file RELEASE_NOTES.md --verify-tag
